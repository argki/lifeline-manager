name: lifeline-manager

services:
  lifeline-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeline-manager
    ports:
      - "127.0.0.1:3456:3456"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3456
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3456/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
