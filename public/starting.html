<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>起動中... - ライフライン使用量・料金管理アプリ</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --border: #d8dee6;
        --text: #1e293b;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-soft: #eff6ff;
        --update: #0284c7;
        --update-soft: #e0f2fe;
        --warn-bg: #fffbeb;
        --warn-text: #b45309;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo',
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 500px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px 24px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      .spinner-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 16px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #dbeafe;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      body.mode-update .spinner {
        border-color: #bae6fd;
        border-top-color: var(--update);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .badge.update {
        background: var(--update-soft);
        color: var(--update);
      }
      .badge.warn {
        background: var(--warn-bg);
        color: var(--warn-text);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.4;
      }
      p {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.65;
        color: var(--text-muted);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        background: var(--primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--primary-hover);
      }
      .status {
        font-size: 12px;
        color: var(--text-muted);
      }
      .timeout-note {
        display: none;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--warn-bg);
        color: var(--warn-text);
        font-size: 13px;
        line-height: 1.6;
        text-align: left;
      }
      .timeout-note.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="spinner-wrap" aria-hidden="true">
        <div class="spinner"></div>
      </div>
      <div id="status-badge" class="badge">起動中</div>
      <h1 id="page-heading">アプリを起動しています…</h1>
      <p id="page-description">
        コンテナとローカルサーバーの準備を行っています。<br />
        起動が完了すると、このまま自動的にアプリ画面へ切り替わります。
      </p>
      <div class="actions">
        <button id="retry-btn" type="button">今すぐ接続を確認</button>
        <div id="status-text" class="status">サーバーの応答を待機しています…（0秒経過）</div>
      </div>
      <div id="timeout-note" class="timeout-note" role="status">
        起動に時間がかかっています。Docker が起動していないか、コンソール画面（黒い画面）にエラーが表示されている可能性があります。コンソール画面の内容をご確認のうえ、必要に応じて再起動してください。
      </div>
    </main>
    <script>
      const APP_URL = 'http://127.0.0.1:3456/';
      const HEALTH_URL = 'http://127.0.0.1:3456/api/health';
      const POLL_INTERVAL_MS = 800;

      const params = new URLSearchParams(window.location.search);
      const isUpdateMode = params.get('mode') === 'update';
      const TIMEOUT_NOTICE_MS = isUpdateMode ? 180000 : 35000;

      const statusBadge = document.getElementById('status-badge');
      const pageHeading = document.getElementById('page-heading');
      const pageDescription = document.getElementById('page-description');
      const statusText = document.getElementById('status-text');
      const retryBtn = document.getElementById('retry-btn');
      const timeoutNote = document.getElementById('timeout-note');

      if (isUpdateMode) {
        document.body.classList.add('mode-update');
        document.title = 'アップデート中... - ライフライン使用量・料金管理アプリ';
        if (statusBadge) {
          statusBadge.textContent = 'アップデート中';
          statusBadge.classList.add('update');
        }
        if (pageHeading) {
          pageHeading.textContent = 'アプリをアップデートしています…';
        }
        if (pageDescription) {
          pageDescription.innerHTML =
            'コンテナの再ビルドと最新化を行っています。<br />通常よりお時間がかかる場合がありますが、完了すると自動的にアプリ画面へ切り替わります。';
        }
        if (timeoutNote) {
          timeoutNote.textContent =
            'アップデート・再ビルドに時間がかかっています。Docker が起動していないか、コンソール画面（黒い画面）にエラーが表示されていないかご確認ください。';
        }
      }

      const startedAt = Date.now();
      let checking = false;
      let redirected = false;
      let initialServerStartedAt = undefined;
      let sawServerRestartOrStop = !isUpdateMode;

      function updateElapsedText() {
        if (redirected || !statusText) return;
        const elapsedSec = Math.floor((Date.now() - startedAt) / 1000);
        const prefix = isUpdateMode
          ? 'アップデート完了を待機しています…'
          : 'サーバーの応答を待機しています…';
        statusText.textContent = `${prefix}（${elapsedSec}秒経過）`;

        if (Date.now() - startedAt >= TIMEOUT_NOTICE_MS) {
          if (statusBadge) {
            statusBadge.textContent = isUpdateMode
              ? 'アップデート待機中（時間超過）'
              : '起動待機中（時間超過）';
            statusBadge.classList.remove('update');
            statusBadge.classList.add('warn');
          }
          if (timeoutNote) {
            timeoutNote.classList.add('visible');
          }
        }
      }

      async function checkHealth(manual) {
        if (checking || redirected) return;
        checking = true;
        if (manual && statusText) {
          statusText.textContent = '接続を確認しています…';
        }
        try {
          const res = await fetch(HEALTH_URL, { cache: 'no-store' });
          if (res.ok) {
            let serverStartedAt = null;
            try {
              const data = await res.json();
              serverStartedAt = typeof data?.startedAt === 'string' ? data.startedAt : null;
            } catch {
              serverStartedAt = null;
            }

            if (isUpdateMode && !sawServerRestartOrStop) {
              if (initialServerStartedAt === undefined) {
                // アップデート開始時点で既に旧コンテナが稼働していた場合は、再起動を待つ
                initialServerStartedAt = serverStartedAt;
              } else if (serverStartedAt && serverStartedAt !== initialServerStartedAt) {
                sawServerRestartOrStop = true;
              }
            }

            if (sawServerRestartOrStop) {
              redirected = true;
              if (statusText) {
                statusText.textContent = isUpdateMode
                  ? 'アップデートが完了しました。アプリへ移動します…'
                  : '起動が完了しました。アプリへ移動します…';
              }
              window.location.replace(APP_URL);
              return;
            }
          }
        } catch {
          // アップデート中に旧コンテナが停止した場合は、次の応答で新コンテナとみなす
          if (isUpdateMode) {
            sawServerRestartOrStop = true;
          }
        } finally {
          checking = false;
          if (!redirected && manual) {
            updateElapsedText();
          }
        }
      }

      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          void checkHealth(true);
        });
      }

      void checkHealth(false);
      setInterval(() => {
        updateElapsedText();
        void checkHealth(false);
      }, POLL_INTERVAL_MS);
    </script>
  </body>
</html>
