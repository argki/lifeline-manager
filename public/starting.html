<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>起動中... - ライフライン使用量・料金管理アプリ</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --border: #d8dee6;
        --text: #1e293b;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-soft: #eff6ff;
        --warn-bg: #fffbeb;
        --warn-text: #b45309;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo',
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px 24px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      .spinner-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 16px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #dbeafe;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .badge.warn {
        background: var(--warn-bg);
        color: var(--warn-text);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.4;
      }
      p {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.65;
        color: var(--text-muted);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        background: var(--primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--primary-hover);
      }
      .status {
        font-size: 12px;
        color: var(--text-muted);
      }
      .timeout-note {
        display: none;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--warn-bg);
        color: var(--warn-text);
        font-size: 13px;
        line-height: 1.6;
        text-align: left;
      }
      .timeout-note.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="spinner-wrap" aria-hidden="true">
        <div class="spinner"></div>
      </div>
      <div id="status-badge" class="badge">起動中</div>
      <h1>アプリを起動しています…</h1>
      <p>
        コンテナとローカルサーバーの準備を行っています。<br />
        起動が完了すると、このまま自動的にアプリ画面へ切り替わります。
      </p>
      <div class="actions">
        <button id="retry-btn" type="button">今すぐ接続を確認</button>
        <div id="status-text" class="status">サーバーの応答を待機しています…（0秒経過）</div>
      </div>
      <div id="timeout-note" class="timeout-note" role="status">
        起動に時間がかかっています。Docker が起動していないか、コンソール画面（黒い画面）にエラーが表示されている可能性があります。コンソール画面の内容をご確認のうえ、必要に応じて再起動してください。
      </div>
    </main>
    <script>
      const APP_URL = 'http://127.0.0.1:3456/';
      const HEALTH_URL = 'http://127.0.0.1:3456/api/health';
      const POLL_INTERVAL_MS = 800;
      const TIMEOUT_NOTICE_MS = 35000;

      const statusBadge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const retryBtn = document.getElementById('retry-btn');
      const timeoutNote = document.getElementById('timeout-note');

      const startedAt = Date.now();
      let checking = false;
      let redirected = false;

      function updateElapsedText() {
        if (redirected || !statusText) return;
        const elapsedSec = Math.floor((Date.now() - startedAt) / 1000);
        statusText.textContent = `サーバーの応答を待機しています…（${elapsedSec}秒経過）`;

        if (Date.now() - startedAt >= TIMEOUT_NOTICE_MS) {
          if (statusBadge) {
            statusBadge.textContent = '起動待機中（時間超過）';
            statusBadge.classList.add('warn');
          }
          if (timeoutNote) {
            timeoutNote.classList.add('visible');
          }
        }
      }

      async function checkHealth(manual) {
        if (checking || redirected) return;
        checking = true;
        if (manual && statusText) {
          statusText.textContent = '接続を確認しています…';
        }
        try {
          const res = await fetch(HEALTH_URL, { cache: 'no-store' });
          if (res.ok) {
            redirected = true;
            if (statusText) {
              statusText.textContent = '起動が完了しました。アプリへ移動します…';
            }
            window.location.replace(APP_URL);
            return;
          }
        } catch {
          // サーバー起動中は接続エラーになるため待機を継続
        } finally {
          checking = false;
          if (!redirected && manual) {
            updateElapsedText();
          }
        }
      }

      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          void checkHealth(true);
        });
      }

      void checkHealth(false);
      setInterval(() => {
        updateElapsedText();
        void checkHealth(false);
      }, POLL_INTERVAL_MS);
    </script>
  </body>
</html>
